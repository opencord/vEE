<div class="row">
  <div class="col-xs-12">
    <h1>CFM/OAM Jitter and Delay Monitoring</h1>
    <p>Select the appropriate MD, MA, MEP, and DM for which you would like to monitor delay and jitter statistics.</p>
    <btn class="btn btn-success"
         ng-show="vm.displayButton"
         ui-sref="xos.cfmstat"
         ui-sref-opts="{mdName: vm.md.mdName, maName: vm.ma.maName, mepId: vm.mepValue, dmId: vm.dmValue}"
    >
      View Delay and Jitter
    </btn>
  </div>
  {{vm.params}}
</div>

<div class="row">
  <div class="col-xs-3">
    <h4>Maintenance Domains (MD)</h4>
  </div>
  <div class="col-xs-3">
    <h4>Maintenance Associations (MA)</h4>
  </div>
  <div class="col-xs-3">
    <h4>MA Endpoints (MEP)</h4>
  </div>
  <div class="col-xs-3">
    <h4>Delay Measurements (DM)</h4>
  </div>
</div>

<div class="row">
  <div class="col-xs-3">
    <div class="form-group">
      <select class="form-control" id="md" size="25" ng-model="vm.mdValue" ng-change="vm.triggerRefresh('md')">
        <option ng-repeat="md in vm.mds" value="{{md.mdNumericId}}">{{md.mdName}} (ID {{md.mdNumericId}})</option>
      </select>
    </div>
  </div>
  <div class="col-xs-3">
    <div class="form-group">
      <select class="form-control" id="ma" size="25" ng-model="vm.maValue" ng-change="vm.triggerRefresh('ma')">
        <option ng-repeat="ma in vm.mas" value="{{ma.maNumericId}}">{{ma.maName}} (ID {{ma.maNumericId}})</option>
      </select>
    </div>
  </div>
  <div class="col-xs-3">
    <div class="form-group">
      <select class="form-control" id="mep" size="25" ng-model="vm.mepValue" ng-change="vm.triggerRefresh('mep')">
        <option ng-repeat="mep in vm.meps" value="{{mep.rmep}}">{{mep.rmep}}</option>
      </select>
    </div>
  </div>
  <div class="col-xs-3">
    <div class="form-group">
      <select class="form-control" id="dm" size="25" ng-model="vm.dmValue">
        <option ng-repeat="dm in vm.dms" value="{{dm.dmId}}">{{dm.dmId}}</option>
      </select>
    </div>
  </div>
</div>
